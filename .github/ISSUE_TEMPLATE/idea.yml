name: Idea or request
description: Something you'd like the Android version to do (a feature, an option, a device)
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Small or big, every idea is welcome. Say what you'd like and when you'd use it. Ideas for the game itself on Windows belong to [tsapZ/SSARecomp](https://github.com/tsapZ/SSARecomp/issues).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Touch controls
        - Controllers
        - Graphics and frame rate
        - Settings menu
        - Setup screen
        - Another device or GPU
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should it do, and when would you use it?
    validations:
      required: true
