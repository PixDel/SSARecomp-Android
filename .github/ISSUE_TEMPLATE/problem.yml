name: Problem
description: Something doesn't work as it should in the Android version (a crash, a wrong picture, touch, a controller)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! This is the **Android port**. Problems of the Windows version belong to [tsapZ/SSARecomp](https://github.com/tsapZ/SSARecomp/issues).
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Crash or freeze
        - Picture / graphics (wrong colours, flicker, black screen)
        - Frame rate
        - Sound
        - Touch controls
        - Controller
        - Portal or figures
        - Saves
        - Setup screen (ISO, driver, Lossless.dll)
        - Frame generation
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Where in the game (level, menu), what you did just before, what you saw or heard. A screenshot helps with picture problems.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Maker and model, and its chip if you know it, e.g. Honor MagicPad 2, Snapdragon 8s Gen 3
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Settings > About, e.g. Android 16
  - type: dropdown
    id: driver
    attributes:
      label: Graphics driver
      description: Menu > Graphics > Graphics driver
      options:
        - Bundled (Turnip T30)
        - Own (imported), name it below
        - System
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings that differ from the defaults
      description: e.g. 3D picture size 840x528, frame generation on, the name of an imported driver
  - type: input
    id: version
    attributes:
      label: App version
      description: The release you installed, e.g. 0.3.0
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Optional. The newest file in Android/data/de.pixdel.ssarecomp/files/userdata/logs (drag it here or paste the end of it).
