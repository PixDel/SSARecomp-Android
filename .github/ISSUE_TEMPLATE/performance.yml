name: Performance report
description: Tell what frame rate your device reaches, with which settings (it helps others pick theirs)
labels: [performance]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! The port was tuned on one device only (Honor MagicPad 2, Snapdragon 8s Gen 3). Your numbers show what other devices manage. Switch on Menu > Game > Frame rate display to see the frame rate.
  - type: input
    id: device
    attributes:
      label: Device
      description: Maker and model, e.g. Samsung Galaxy Tab S9
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip
      description: e.g. Snapdragon 8 Gen 2 (Adreno 740). Settings > About, or the device's spec page.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
  - type: dropdown
    id: size
    attributes:
      label: 3D picture size
      description: Menu > Graphics > 3D picture size
      options:
        - Performance (560x352)
        - Balanced (700x440)
        - Sharp (840x528)
        - Original (1120x704)
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: Graphics driver
      options:
        - Bundled (Turnip T30)
        - Own (imported), name it below
        - System
    validations:
      required: true
  - type: input
    id: other
    attributes:
      label: Other settings
      description: Frame rate limit (30/60), frame generation, sharpening, an imported driver's name
  - type: textarea
    id: fps
    attributes:
      label: Frame rate
      description: What the FPS display shows, and where (hub, a level, a cutscene). Steady, or dips where?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: e.g. 0.3.0
