plugins {
    id "com.android.application"
}

// The native libraries come from the CMake build (tools/android/build.ps1 copies them to
// app/src/main/jniLibs/arm64-v8a); SDL's Java side is used straight from the SDK's SDL3 checkout.
def sdlJava = "../../thirdparty/rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java"

// The supported discs' default.xex (the setup screen checks the player's disc against them).
def xexHashes = file("../../docs/game/default.xex.sha256").readLines()
        .collect { it.trim().split(/\s+/)[0] }.findAll { it ==~ /[0-9a-fA-F]{64}/ }.join(",")

// Release signing: a keystore outside the repository, named in a properties file
// (default C:/dev/keys/ssarecomp-release.properties: storeFile, storePassword, keyAlias,
// keyPassword), or SSARECOMP_SIGNING=<path>. Without it the release APK stays unsigned.
def signingFile = file(System.getenv("SSARECOMP_SIGNING") ?: "C:/dev/keys/ssarecomp-release.properties")
def signingProps = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace "de.pixdel.ssarecomp"
    compileSdk 35

    defaultConfig {
        applicationId "de.pixdel.ssarecomp"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
        ndk { abiFilters "arm64-v8a" }
        buildConfigField "String", "XEX_SHA256", "\"${xexHashes}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        if (signingProps.storeFile) {
            release {
                storeFile file(signingProps.storeFile)
                storePassword signingProps.storePassword
                keyAlias signingProps.keyAlias
                keyPassword signingProps.keyPassword
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += [sdlJava]
        }
    }

    packaging {
        // Extracted to the native library folder: the game finds its GPU plugin next to itself.
        jniLibs { useLegacyPackaging true }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            if (signingProps.storeFile) signingConfig signingConfigs.release
        }
    }
}
